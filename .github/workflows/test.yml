name: Verificació
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: glow
          POSTGRES_USER: glow
          POSTGRES_PASSWORD: local-ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Proves
        env:
          TEST_DATABASE: ${{ matrix.database }}
        run: |
          mkdir -p work
          if [ "$TEST_DATABASE" = "postgres" ]; then
            export DATABASE_URL=postgresql://glow:local-ci-only@127.0.0.1:5432/glow
          fi
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py test --noinput
